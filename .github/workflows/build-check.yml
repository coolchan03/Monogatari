name: Build check

on:
  push:
    branches:
      - 'devel'
      - 'claude/**'
      - 'step-*'
      - 'batch-*'
      - 'ccr-*'
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Monogatari source/UI guardrails
        run: python3 scripts/qa/verify_bucket345.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set extension repository defaults
        env:
          MONOGATARI_REPOS: ${{ secrets.MONOGATARI_REPOS }}
        shell: bash
        run: printf 'monogatari.repos=%s\n' "$MONOGATARI_REPOS" >> local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build release (unsigned, R8)
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: monogatari-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  startup-smoke:
    name: Cold-start emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: smoke-apk
      - name: Enable KVM acceleration if available
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch on clean Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/ci-smoke-startup.sh
      - name: Preserve startup crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-logs
          path: |
            smoke-logcat.txt
            smoke-crash-buffer.txt
            smoke-start-output.txt
            smoke-phone.png
            smoke-tablet.png
            smoke-tablet-start.txt
            smoke-tablet-crash-buffer.txt
            smoke-tablet-land.png
            smoke-tablet-land-start.txt
            smoke-tablet-land-crash-buffer.txt
          if-no-files-found: warn
