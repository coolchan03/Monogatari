name: Build check

on:
  push:
    branches:
      - 'devel'
      - 'claude/**'
      - 'step-*'
      - 'batch-*'
      - 'ccr-*'
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set extension repository defaults
        env:
          MONOGATARI_REPOS: ${{ secrets.MONOGATARI_REPOS }}
        shell: bash
        run: printf 'monogatari.repos=%s\n' "$MONOGATARI_REPOS" >> local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build release (unsigned, R8)
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: monogatari-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
