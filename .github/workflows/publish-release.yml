name: Publish signed Android release
on:
  # A pushed v* tag publishes that tag's commit; manual dispatch still works for dry runs.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch or commit to build (defaults to the development branch)'
        required: true
        default: 'devel'
        type: string
      tag:
        description: 'New release tag (for example v2026.10.12)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify the signed APK without publishing'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.source_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set extension repository defaults
        env:
          MONOGATARI_REPOS: ${{ secrets.MONOGATARI_REPOS }}
        shell: bash
        run: printf 'monogatari.repos=%s\n' "$MONOGATARI_REPOS" >> local.properties
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate release inputs and credentials
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo "Invalid release tag"; exit 1; }
          for key in RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing required secret: $key"; exit 1; }
          done
          # A dispatched release creates its tag; a pushed tag is the release itself.
          if [[ "${{ github.event_name }}" != "push" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists: $TAG"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"; exit 1
          fi
      # Separating test and release builds prevents Kotlin's release compiler from
      # inheriting the memory-heavy debug test graph (OOM in run 38798747198).
      - name: Validate responsive UI and touch targets
        run: python3 scripts/validate-ui-a11y.py
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Stop test compilers before release build
        run: ./gradlew --stop
      - name: Build release APK
        run: ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease --stacktrace
      - name: Sign, verify and checksum release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SIGNER" || { echo "Missing Android build tools 35.0.0"; exit 1; }
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$INPUT" || { echo "Unsigned release APK not found"; exit 1; }
          mkdir -p dist
          "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out dist/Monogatari-release.apk "$INPUT"
          "$SIGNER" verify --verbose --print-certs dist/Monogatari-release.apk
          (cd dist && sha256sum Monogatari-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: signed-release
          path: dist/
      - name: Publish public GitHub release
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Release notes come from docs/RELEASE_<version>_NOTES.md when present (v1.0.0 -> RELEASE_1_0_0_NOTES.md).
          NOTES="docs/RELEASE_$(echo "${TAG#v}" | tr '.' '_')_NOTES.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" dist/release-notes.md
          else
            echo "Signed Android release." > dist/release-notes.md
          fi
          printf '\n\nCommit: %s\nSHA256SUMS.txt verifies the APK download.\n' "$GITHUB_SHA" >> dist/release-notes.md
          gh release create "$TAG" dist/Monogatari-release.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Monogatari $TAG" --notes-file dist/release-notes.md
